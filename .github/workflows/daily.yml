name: daily

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily
  workflow_dispatch: {}     # manual trigger for catch-up runs

concurrency:
  group: daily-run          # overlapping runs must never race the committed db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Daily run (collect + compute + outputs)
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          SHADEFORM_API_KEY: ${{ secrets.SHADEFORM_API_KEY }}
        run: python -m tci.run daily
      - name: Weekly validation report (Mondays, warn-only)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python -m tci.run validate || echo "::warning::validate reported issues"
          fi
      # Diagnose before committing, and only when something went wrong. A failed run
      # now records its reason in `runs.notes`, but CI logs age out and are not public,
      # so surface it here while the job is still on screen.
      - name: Why did it fail
        if: failure()
        run: |
          python - <<'EOF'
          from tci import db
          conn = db.connect()
          rows = conn.execute(
              "SELECT source, status, notes FROM runs WHERE utc_date = date('now')"
              " ORDER BY source"
          ).fetchall()
          for r in rows:
              print(f"{r['source']:16} {r['status']:8} {r['notes'] or ''}")
          EOF

      # Runs even when the step above failed. Observations are live prices that cannot
      # honestly be re-collected for a past date, so a day's raw data is irreplaceable
      # the moment the runner is torn down. Committing it is strictly better than losing
      # it: the worst case is a database with rows and no recomputed print, which the
      # next run fixes, and `backfill` can recompute from stored observations at any
      # time. Four sessions of collection were thrown away in September 2026 because
      # this step was skipped whenever anything upstream failed.
      - name: Commit data + outputs
        if: success() || failure()
        run: |
          git config user.name "tci-bot"
          git config user.email "rusch.mh@gmail.com"
          # Mark a commit made after a failed run so the history says so plainly.
          SUFFIX=""
          if [ "${{ job.status }}" != "success" ]; then SUFFIX=" (partial: run failed)"; fi

          # Bounded retry, not a single fallback. data/eucri.db is SQLite, so even one
          # `git pull --rebase` conflict on it is not real content to reconcile line by
          # line - every "main moved" case is handled the same way, by resetting to the
          # new tip and recomputing from scratch (collection is dated and idempotent per
          # day, so redoing it costs nothing) rather than attempting to merge two
          # independently-generated trees. A single fallback attempt was not enough: on
          # 2026-09-16 it rebuilt once and recommitted, then the final unconditional push
          # still failed (exit 128) because main advanced a SECOND time during the ~3
          # minutes the rebuild took, with nothing left to retry past that. Three
          # attempts costs at most a few extra minutes against a race that, empirically,
          # has never needed more than one retry to clear.
          for attempt in 1 2 3; do
            git add data/eucri.db site/ config/term_schedules.yaml
            if git diff --cached --quiet; then
              echo "nothing to commit"
              break
            fi
            git commit -m "daily: $(date -u +%F)${SUFFIX}"
            if git push origin main; then
              break
            fi
            echo "::warning::push rejected on attempt ${attempt}/3; main advanced during this run, rebuilding today's outputs on top of it"
            git reset --hard origin/main
            if [ "$attempt" = "3" ]; then
              echo "::error::still losing the race after 3 attempts; today's run is not committed"
            else
              python -m tci.run daily
            fi
          done
