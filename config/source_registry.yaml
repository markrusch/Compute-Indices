    auth: none
    blocks: [EU_EEA]
    gpu_classes: [H100, H200, A100, H100P]
    access_basis: >-
      Same public unauthenticated feed as the on-demand meters, same query, one extra
      OData clause. No separate terms apply.
    discovered: 2026-09-08
    discovered_via: forward-curve-scan
    last_reviewed: 2026-09-08
    notes: >-
      The only observed term structure available to this index. Azure publishes 1-, 3-
      and 5-year reservations alongside on-demand, spot and low-priority meters for the
      same node, giving six price points per SKU per region. Measured westeurope
      2026-09-08, H100 SXM: on-demand $15.98, 1yr $10.23, 3yr $7.01, 5yr $6.39, spot
      $2.95 per GPU-hour. The reservation retailPrice is a whole-term UPFRONT TOTAL
      carrying a "1 Hour" unit label, which is wrong in the feed; the collector divides
      by term hours and keeps the raw figure for checking. None of these rows can reach
      a print: normalise.py admits only term=on_demand and tier in (executable, list).

