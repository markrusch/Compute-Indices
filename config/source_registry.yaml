# The source ledger: every price surface this project has looked at, including the ones it
# decided against and the ones it cannot use yet.
#
# SOURCES.md is the published, human-facing table of what is actually in the calculation
# path. This file is the working register behind it, and it is deliberately larger. A
# source rejected in July is worth keeping, because the reason it was rejected ("needs an
# API key", "no EU capacity", "JS-only pricing page") is exactly the sort of thing that
# changes without announcement. A ledger of rejections is the only way to notice when one
# stops being true.
#
# Not part of the calculation path, not hash-locked. Adding a row here changes no print.
# Promoting a row to status 'live' means writing a collector and following GOVERNANCE.md
# section 1: version bump, CHANGELOG entry, one publication's notice.
#
# status:
#   live       - in the calculation path today
#   built      - collector exists and is correct, blocked on something external (a token)
#   candidate  - passed the admission screen, no collector written yet
#   watchlist  - known, does not qualify today, worth re-checking. `recheck` says on what
#   rejected   - screened out. `reason` is mandatory and survives forever
#   retired    - was live, is gone. The date it stopped is part of the audit trail
#
# tier mirrors normalise.py: 'executable' is an ask someone could transact against right
# now, 'list' is a published rate card, 'reference' never enters a print at all.
#
# blocks are keys from config/regions.yaml. A source serving a shadow block is worth
# building even though nothing is published from it yet - see that file on why.

schema_version: 1
review_interval_days: 90   # a live or built row unreviewed for longer is flagged by
                           # `python -m tci.run sources --due`

scans:
  - date: 2026-09-12
    added: 14
    notes: >-
      Out-of-cycle: two competing indices launched (computepulse.net, computeindex.io),
      one used as a name-harvest channel. research/source-scans/2026-09-12.md
  - date: 2026-09-07
    added: 20
    notes: >-
      First run of the discovery process. Four candidates reachable through a package
      already installed, plus the Norway bug. research/source-scans/2026-09-07.md

