    reason: >-
      A competing index, not a source, same as silicon_data. Its own methodology page
      names three live inputs -- Azure retail, Shadeform, Vast.ai -- against a global
      unit, not EU/EEA; AWS, CoreWeave, Lambda, RunPod, GCP and Oracle are shown but
      excluded from its own computation as static rate cards. Fails gate 3 as a price
      (no region breakdown) and gate 5 (nothing here is first-hand). The `/indices/history`
      endpoint is unauthenticated and returns real daily series back to 2026-03-21 for
      `h100-global-compute` and `blackwell-global-compute`; worth pulling into
      config/check_series.csv as a change-correlation diagnostic, never as an index input.
    recheck: "a per-region breakdown, which would still leave gate 5 unresolved"

