    auth: none
    blocks: [EU_EEA, US]
    gpu_classes: [H100, A100]
    access_basis: >-
      Public search API used by the site's own search UI; scope limited to
      datacenter-verified hosts (verification=verified AND hosting_type=1).
    discovered: 2026-07-18
    discovered_via: initial-build
    last_reviewed: 2026-09-08
    notes: >-
      Offers stored globally; the EU filter lives in the calculation path. From
      2026-09-08 also carries the bid price (min_bid) as a second row at
      tier=interruptible, and stores the venue's measured per-offer capability
      fields: dlperf, total_flops, gpu_mem_bw, pcie_bw, bw_nvlink, gpu_max_power,
      gpu_max_temp, disk_bw. This is the only source in the panel publishing a power
      or thermal envelope. B200 and H200 are offered here and deliberately NOT mapped:
      both are reference variants of published classes, so admitting them is a
      constituent change requiring a version bump and a notice.

