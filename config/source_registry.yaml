  # ---- rejected -------------------------------------------------------------
  - id: gpu_ai_index
    name: GPU.ai price index
    kind: aggregator
    status: rejected
    tier: reference
    homepage: https://gpu.ai/gpu-price-index
    endpoint: "public no-auth JSON API linked from the page's Dataset markup"
    auth: none
    blocks: []
    gpu_classes: []
    discovered: 2026-09-07
    discovered_via: "tier-3 sweep"
    last_reviewed: 2026-09-07
    reason: >-
      Fails gate 3, which is the one gate a fix cannot route around. The API is
      unauthenticated and the data is free to cite with attribution, so gate 1 passes
      cleanly -- but the index publishes floor prices across the whole fleet with no
      regional or country breakdown at all. A price with no location can enter neither the
      EU/EEA headline nor any future regional series. Gate 5 would also bite: it is an
      aggregate of other clouds.
    recheck: "per-region or per-country breakdown in the published API"

  - id: eurohpc_ai_factories
    name: EuroHPC AI Factories
    kind: reference
    status: rejected
    tier: reference
    homepage: https://eurohpc-ju.europa.eu/large-scale-access-ai-factories_en
    auth: none
    blocks: [EU_EEA]
    gpu_classes: [H100, H200]
    discovered: 2026-09-07
    discovered_via: "tier-1 public-sector channel"
    last_reviewed: 2026-09-07
    reason: >-
      Not a market price. Access is free of charge for SMEs and startups and subsidised
      otherwise, so the rate reflects an allocation policy rather than what a buyer pays.
      Ingesting it would import a political number into a commercial index. 19 sites, six
      deploying in 2026 across CZ, LT, NL, PL, RO and ES.
    recheck: >-
      commercial arm's-length rates published by a hosting entity, which would be a
      separate source under that entity's own name

  - id: aws_capacity_blocks
    name: AWS Capacity Blocks for ML
    kind: hyperscaler
    status: rejected
    tier: executable
    homepage: https://aws.amazon.com/ec2/capacityblocks/
    endpoint: "DescribeCapacityBlockOfferings (EC2)"
    auth: iam
