# Intraday sampling. Research beside the index, OUTSIDE the calculation path and outside
# METHODOLOGY.lock: nothing in this file can move a published print. The 11:00 UTC daily
# run still collects the fixing on its own, into `observations`, exactly as before. The
# sweeps configured here go to a separate store (data/intraday/) that no print reads.
#
# Why the cadences differ. A marketplace book (vast.ai) or a stock-driven feed (RunPod,
# Hyperstack) moves inside a day, and reading it once at 11:00 hides that. A rate card on a
# pricing page changes a few times a year; reading it every hour would multiply the load on
# somebody else's server by 24 to learn nothing. So each source is read at the cadence its
# price can actually move, and the conduct rule in SOURCES.md ("1 request per source per
# day unless a row says otherwise and why") is amended there, per source, to match.
#
# max_age_hours is how long one successful read may stand for that source in a
# reconstructed intraday value. It exists because a sweep can miss a source (a 502, a
# delayed Actions runner) and the alternative - the source vanishing from the panel for
# an hour - moves the median by composition, not by price. Past max_age the source drops
# out and the reconstructed value says so; nothing is carried further than this.

version: 1

# The workflow fires hourly; a source is due when its last successful read (intraday sweep
# or the daily fixing, whichever is newer) is at least `every_hours` old, less this slack.
# Without the slack a runner that starts at :17 one hour and :09 the next would skip a
# source whose read is 52 minutes old and leave a two-hour hole.
due_slack_minutes: 20

# Guards that keep one bad source from costing the rest of the sweep.
#
# Sources are read in parallel, `workers` at a time, each on its own HTTP session. A read
# that has run longer than `source_timeout_seconds` is abandoned and recorded as failed;
# whatever has not finished when `sweep_budget_seconds` is spent is recorded the same way,
# and the sweep writes what it has. The fixing run once lost four sessions to a single
# collector's error; a hung socket here would otherwise hold every other source's read
# hostage until the Actions runner is killed, and a killed runner commits nothing.
workers: 4
source_timeout_seconds: 300
sweep_budget_seconds: 900

# A source that keeps failing is asked less often, not every hour: the wait doubles with
# each consecutive failure (1, 2, 4, 8 ... times its cadence) up to this cap, and one
# successful read, by a sweep or by the fixing, resets it.
max_backoff_hours: 24

# The quiet window around the 11:00 fixing, UTC. Inside it this job asks no source that the
# fixing has not already asked today, so an hourly read cannot land in the same minutes as
# the fixing's own and use up a rate limit it needs. It ends at 13:00, not 11:15, because
# GitHub starts the scheduled daily job 10 to 30 minutes late on a normal day. Measured
# 26 September 2026 from response headers: vast.ai allows 30 requests per window of a few
# seconds (one read takes 9), Scaleway 50 per second (one read takes 9), Azure's retail
# feed sends a 60-second retry-after (one read takes 91 requests). A source that answers
# 429 is not asked again by this job for max_backoff_hours; the fixing's next successful
# read resets it.
fixing_guard:
  start: "10:40"
  end: "13:00"

# A day's reads are split into segments of at most this many bytes. A new segment also
# starts when the current one does not verify, so a damaged file is left as it is for
# inspection and never written after.
max_segment_bytes: 8000000

sources:
  # Marketplaces and stock-driven feeds: every sweep.
  vast_ai:        {every_hours: 1, max_age_hours: 3}
  runpod:         {every_hours: 1, max_age_hours: 3}
  hyperstack:     {every_hours: 1, max_age_hours: 3}
  # dstack's gpuhunt catalogs are downloaded from dstack's own bucket, not from the
  # providers, and carry spot rows that move. Hourly costs the providers nothing.
  gpuhunt:        {every_hours: 1, max_age_hours: 3}
  # Rate cards and list catalogs: a few reads a day is plenty.
  # Azure's feed is paged: one read is about 91 requests across ten regions, for a list
  # price that rarely moves. Twice a day, not four times.
  azure_retail:   {every_hours: 12, max_age_hours: 25}
  scaleway:       {every_hours: 6, max_age_hours: 13}
  seeweb:         {every_hours: 6, max_age_hours: 13}
  ovh:            {every_hours: 6, max_age_hours: 13}
  digitalocean:   {every_hours: 6, max_age_hours: 13}
  voltagepark:    {every_hours: 6, max_age_hours: 13}
  lambda_pricing: {every_hours: 6, max_age_hours: 13}
  latitude:       {every_hours: 6, max_age_hours: 13}
  coreweave:      {every_hours: 6, max_age_hours: 13}
  civo:           {every_hours: 6, max_age_hours: 13}
  crusoe:         {every_hours: 6, max_age_hours: 13}
  # A local file: no request at all, so it rides every sweep.
  static_yaml:    {every_hours: 1, max_age_hours: 3}

# The series reconstructed at every sweep. Each is computed by the same code the daily
# fixing uses (commands.print_definitions -> normalise -> index.compute_print), under the
# methodology version live on the sweep's UTC date.
series:
  - EU-CRI-H100
  - EU-CRI-H100-MKT
  - EU-CRI-H100-NC
  - EU-CRI-H100-HS
  - EU-CRI-H200
  - EU-CRI-B200
  - EU-CRI-A100
  - EU-CRI-H100-PCIE

# A settlement window: the average of every reconstructed value inside [start, end) UTC on
# a date. Reported by `tci.run intraday settle` and on intraday.html as a research
# comparison against the 11:00 fixing. It is not a print, is stored nowhere as one, and
# would enter the methodology only as a new version under GOVERNANCE.md §1.
#
# With hourly sweeps at :17 the default window holds three reads (08:17, 09:17, 10:17) and
# closes before the fixing is collected, so the comparison is between two independent
# measurements of the same morning rather than one measurement and itself.
settlement:
  start: "08:00"
  end: "11:00"
  method: mean        # mean | median, over the sweeps inside the window
  min_points: 2       # fewer published values than this in the window -> no settlement value
