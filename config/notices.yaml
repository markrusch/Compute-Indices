# Notices of change to the index methodology.
#
# GOVERNANCE.md §1 step 5 requires one publication's notice before the first print
# computed under a new methodology version. Until now that requirement had no public
# surface: a change could satisfy every other step and still leave a reader to discover
# it in a changelog after the fact. This file is that surface. It is rendered to
# notices.html, and any notice still awaiting its effective date raises a banner on the
# dashboard.
#
# This register is NOT hash-locked and is not read by the calculation path. It announces
# what a change will do; METHODOLOGY.lock is what proves what the code actually does.
#
# status:
#   announced  published, effective date not yet reached. Raises the dashboard banner.
#   in_effect  the first print under the new version has been computed.
#   withdrawn  announced and then not proceeded with. Never delete a notice; withdraw it,
#              because a reader who saw the announcement is owed the retraction.
#
# effect_on_level is mandatory and must be specific. "May affect the level" is not an
# answer; either state the expected direction and rough size, or state that it is not
# yet quantifiable and why.

notices:
  - id: 2026-N2
    title: Verda, Nebius, Lambda and DigitalOcean enter the EU/EEA panel, Oracle joins the
      hyperscaler segment, OVHcloud joins the H100 PCIe class, and the EUR leg becomes T-1
      on every day
    announced: 2026-09-11
    effective: 2026-09-22
    version: 0.5.0
    status: announced
    summary: >-
      The headline population widens from six priced H100 SXM sellers to eight, two static
      entries give way to daily feeds, and the FX rule stops depending on the time of day
      the run happens. On the last full panel the change would have raised the headline
      from $3.25 to $3.49/GPU-hr, a composition effect rather than a price move.
    effect_on_level: >-
      Headline: recomputed on the 7 September panel (the last day with a full set of
      stored rows) with the new sellers at the list prices they published on 11 September,
      the headline would have printed $3.49/GPU-hr instead of $3.25/GPU-hr, +7.4%. Two
      of the changes are like-for-like: Verda replaces the static DataCrunch entry at the
      same $3.25 (verda.com/pricing) and Nebius's catalogue replaces its static entry at
      the same $3.85 (nebius.com/prices). The move comes from Lambda at $3.99
      (lambda.ai/pricing) and DigitalOcean at $4.41 (docs.digitalocean.com, 8x H100 at
      $35.28/hr) entering above the old median, which shifts the weighted median from
      $3.25 to RunPod's $3.49. It is a one-time level shift from widening the panel to
      sellers the EU/EEA population always contained, and it will show in the published
      series on 22 September as a step with no change in any seller's price. The first
      print under v0.5.0 will state its size against a v0.4.0 recomputation of the same
      day. EUR companion: unchanged on any day the run completes before the ECB publishes;
      otherwise the EUR leg now uses the previous day's rate, a difference equal to that
      day's EUR/USD move. The H100 PCIe, H200, B200 and B300 class series gain
      constituents; each still publishes only once five providers qualify.
    body: |
      **New constituents.** Three EU/EEA sellers enter through dstack's open-source gpuhunt
      catalogues, which list a location per row: Verda (Finland and Iceland), Nebius
      (Finland, France, and a private region in Iceland) and Lambda (europe-central-1,
      Germany). DigitalOcean enters through its public pricing page: its H100 Droplets are
      "NVIDIA HGX H100" by its own description and are sold in Amsterdam, New York and
      Toronto at one price, recorded as one row per region, of which only Amsterdam is in
      the EU/EEA population. Oracle Cloud Infrastructure enters the hyperscaler segment,
      where it is priced in the `-HS` series and never in the headline. OVHcloud enters
      through its public order-catalogue API in the H100 PCIe class only; its H100
      instances are "80 GB HBM2e - PCIe 5.0", a different product from the SXM reference
      unit.

      **One company, one vote.** Verda is DataCrunch under a new name. The static
      `datacrunch` entry leaves the panel on the day the Verda feed enters it, and the
      sovereign list names Verda in its place. Nebius's static entry is likewise replaced
      by its catalogue feed rather than kept beside it.

      **Classes.** vast.ai is admitted to the H100 PCIe, H200, B200 and B300 classes, whose
      listings it already publishes and which the index has stored since 11 September.
      The new catalogue feeds are admitted to the classes they list.

      **FX.** The EUR companion uses the ECB reference rate dated strictly before the print
      date. Until now it used the latest rate dated on or before it, which is T-1 when the
      run finishes before the ECB publishes around 14:00 UTC and T when it finishes after:
      the 11 September run finished at 18:22 UTC and took the same-day rate. A print's EUR
      value therefore depended on when it was computed. The rate each earlier print used is
      recorded with it and is what a recomputation converts at.

      **What does not change.** The unit definition, the estimator, the trim, the weights,
      the concentration cap and the publication gate are untouched. The collectors that
      feed these rows run from the day this notice is published, so each new constituent
      has stored history before its first print; nothing collected before the effective
      date is admitted retroactively, and prints dated before it keep the version they
      record.

  - id: 2026-N1
    title: Norway restored to the EU/EEA constituent population, and the collection-time
      node-size floor aligned to the published floor
    announced: 2026-09-08
    effective: 2026-09-15
    version: 0.4.0
    status: announced
    summary: >-
      Two defects found in the source audit of 7 September, both of which have been
      silently narrowing the constituent population against the published methodology.
      They are announced together because they take effect in the same version bump.
    effect_on_level: >-
      Expected to lower the headline slightly or leave it unchanged. Both defects
      currently exclude supply, so correcting them can only add offers to the panel,
      and added offers at the marketplace end of the distribution pull a weighted median
      down rather than up. The size cannot be stated in advance: it depends on how many
      Norwegian and sub-8-GPU offers qualify on the day, which is not known until the
      first print under v0.4.0. Both legs will be quantified against the prior version
      in the CHANGELOG entry for that print.
    body: |
      **Norway.** `config/factors.yaml` lists the EU/EEA constituent countries, and it has
      never contained Norway. The token `NO` is read by YAML 1.1 as boolean false, so
      `eu_eea_countries` holds `False` where it should hold the string `NO`. Every
      Norwegian observation collected since Azure's `norwayeast` region began reporting on
      2026-08-16 has been dropped by the country filter: 126 observations as of the date
      of this notice. Norway is in the EEA, the published unit definition says EU/EEA, and
      the index has therefore been narrower than its own stated scope.

      **Node-size floor.** `filters.min_gpu_count` has been 2 since v0.3.0, which is the
      floor the methodology publishes. The `gpuhunt_` collector has continued to discard
      offers below 8 GPUs at collection time, before storage. Because collectors record
      live prices that cannot honestly be re-collected for a past date, those offers are
      not recoverable; the correction applies from the effective date forward.

      Both are corrections toward the published methodology rather than changes to it.
      Neither alters the unit definition, the estimator, the trim or the weighting. They
      are handled as a minor version bump because each changes the constituent
      population, which is a parameter change under GOVERNANCE.md §1.

      Prints computed before the effective date remain valid under the version they
      record in `daily_index.methodology_version` and are not restated. A gap stays a gap.

      **Added 11 September 2026: the panel becomes explicit, with the same membership.**
      Until this version a provider was in the constituent population if any collector
      produced a row for it, and an unlisted name defaulted to the neocloud segment. From
      v0.4.0 the population is an enumerated panel in `config/factors.yaml`: provider,
      segment, and for each collector the classes it may contribute to. The v0.4.0 panel
      names exactly the providers, collectors and classes that could reach a print before
      it, so by itself it moves no number; every stored print recomputes to the same value
      under it (`python -m tci.run reproduce`). It exists so that a new collector can store
      rows for weeks without any of them reaching a print until a later version admits
      them after its own notice.

      **Effective dates are now enforced in code.** Each version is committed on the day
      of its notice and selected for a print only from its effective date
      (`config/methodology/succession.yaml`), so this version applies to the 15 September
      print whenever the change is merged.
