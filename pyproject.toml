[build-system]
# >=77 for PEP 639: `license` as an SPDX expression plus `license-files`, which
# emits a License-Expression field that SBOM and licence-audit tooling can read
# without guessing from classifiers.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tci-compute-index"
version = "0.1.0"
description = "TCI — The Compute Indices: daily, methodology-transparent reference prices for GPU compute"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mark Rusch", email = "rusch.mh@gmail.com" }]
maintainers = [{ name = "Mark Rusch", email = "rusch.mh@gmail.com" }]
# Software only. The documentation is CC BY 4.0 (LICENSE-docs) and the index data
# is published under separate terms (DATA-TERMS.md) -- a licence over source code
# does not carry rights in the data the program produces. See NOTICE.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "benchmark", "price-index", "gpu", "compute", "reference-rate",
    "iosco", "reproducible-research", "tci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "matplotlib>=3.8,<4",
    "gpuhunt>=0.1,<1",
]

[project.urls]
Homepage = "https://thecomputeindices.com/"
Repository = "https://github.com/markrusch/Compute-Indices"
Methodology = "https://thecomputeindices.com/methodology.html"
Governance = "https://thecomputeindices.com/governance.html"
Changelog = "https://github.com/markrusch/Compute-Indices/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "responses>=0.25",
    "types-requests",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tci = ["migrations/*.sql", "vendor/computable/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored third-party recipes (Computable, Apache-2.0) are kept byte-identical to upstream
# apart from import paths, so they are not reformatted or linted to this repo's rules.
extend-exclude = ["src/tci/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/tci/methodology.py" = ["E501"]  # markdown table rows in the doc template

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["tci.index", "tci.normalise"]
disallow_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["gpuhunt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tci.vendor.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
